[project]
name = "policy-gradient-lab"
version = "0.1.0"
description = "Reproducible policy gradient experiments: REINFORCE, learned baselines, and GAE"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
  "torch>=2.9.1,<3", "numpy>=1.26,<2", "matplotlib>=3.10,<4",
  "gym[classic_control,box2d]==0.25.2", "mujoco>=2.3.3,<3",
  "psutil>=7,<8", "imageio[ffmpeg]>=2.37,<3", "pillow>=11,<13", "requests>=2.32,<3",
]
[project.optional-dependencies]
cloud = ["modal>=1.3,<2"]
tracking = ["wandb[media]>=0.23,<1"]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
package-dir = {"" = "src"}
[tool.setuptools.packages.find]
where = ["src"]
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
[tool.uv.extra-build-dependencies]
box2d-py = ["swig", "setuptools"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
src = ["src"]
